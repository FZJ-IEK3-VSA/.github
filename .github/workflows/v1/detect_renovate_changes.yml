# v1 reusable workflow: Detect dependency names changed by a Renovate PR
#
# Based on: _detect_renovate_changed_libraries.yml (cleaned up for v1)
#
# Parses git diffs from dependency files (conda env YAML, pyproject.toml)
# and extracts the names of packages that were added or updated.
#
# Usage:
#   jobs:
#     detect:
#       if: startsWith(github.head_ref, 'renovate/')
#       uses: FZJ-IEK3-VSA/.github/.github/workflows/v1/detect_renovate_changes.yml@v1
#       with:
#         files: "requirements-dev.yml pyproject.toml"
#
#     extract:
#       needs: detect
#       if: needs.detect.outputs.libraries != ''
#       uses: FZJ-IEK3-VSA/.github/.github/workflows/v1/extract_versions.yml@v1
#       with:
#         libraries: ${{ needs.detect.outputs.libraries }}
#         version_type: max

name: "v1: Detect Renovate changes"

on:
  workflow_call:
    inputs:
      files:
        description: "Space-separated list of dependency files to inspect for changes (relative to repo root)"
        type: string
        default: "requirements_dev.yml pyproject.toml"
        required: false
    outputs:
      libraries:
        description: "Comma-separated list of changed library names (empty if none)"
        value: ${{ jobs.detect.outputs.libraries }}

jobs:
  detect:
    name: Detect changed dependency names
    runs-on: ubuntu-latest
    outputs:
      libraries: ${{ steps.detect.outputs.libraries }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed libraries
        id: detect
        env:
          FILES: ${{ inputs.files }}
        run: |
          git fetch origin ${{ github.base_ref }}
          git diff origin/${{ github.base_ref }}...HEAD -- $FILES > /tmp/dep_diff.txt

          python3 << 'PYEOF'
          import re, os

          with open('/tmp/dep_diff.txt') as f:
              diff = f.read()

          # Names to skip -- not installable packages / environment metadata
          SKIP = {'pip', 'nodefaults'}

          packages = set()
          for line in diff.split('\n'):
              if not line.startswith('+') or line.startswith('+++'):
                  continue

              # conda environment style:  "  - scikit-learn >=1.2,<=1.7.2"
              m = re.match(r'^\+\s+-\s+([A-Za-z0-9][A-Za-z0-9._-]*)', line)
              if m:
                  pkg = m.group(1).lower()
                  if pkg not in SKIP:
                      packages.add(pkg)
                  continue

              # pyproject.toml style:  '    "scikit-learn>=1.2,<=1.7.2",'
              m = re.match(r'^\+\s+"([A-Za-z0-9][A-Za-z0-9._-]*)[>=<!]', line)
              if m:
                  packages.add(m.group(1).lower())

          result = ','.join(sorted(packages))
          print(f"Detected changed libraries: {result or '(none)'}")

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"libraries={result}\n")
          PYEOF
