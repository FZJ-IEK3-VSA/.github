# v1 reusable workflow: Query available conda versions for a package
#
# Queries the Anaconda.org API for all available versions of a package on a
# given channel, optionally filtering by min/max version bounds.
#
# Based on: _query_conda_forge_versions.yml (cleaned up for v1)
#
# Usage:
#   jobs:
#     query:
#       uses: FZJ-IEK3-VSA/.github/.github/workflows/v1/query_conda_versions.yml@v1
#       with:
#         package_name: numpy
#         min_version: "1.23.0"
#         max_version: "2.0.0"
#         dependency_position_env_file: "5"
#         requirements_file_name: requirements-dev.yml
#
#     test:
#       needs: query
#       strategy:
#         fail-fast: false
#         matrix:
#           include: ${{ fromJSON(needs.query.outputs.matrix_json) }}
#       uses: FZJ-IEK3-VSA/.github/.github/workflows/v1/run_conda_forge_test.yml@v1
#       with:
#         runner_tag: self-hosted
#         requirements_file_name: ${{ matrix.requirements_file_name }}
#         library_name: ${{ matrix.library_name }}
#         library_version: ${{ matrix.library_version }}
#         dependency_position_env_file: ${{ matrix.dependency_position_env_file }}

name: "v1: Query conda versions"

on:
  workflow_call:
    inputs:
      package_name:
        description: "Name of the package to query (e.g. numpy, pandas)"
        required: true
        type: string
      min_version:
        description: "Minimum version, inclusive (e.g. '1.23.0'). Leave empty for no lower bound."
        default: ""
        required: false
        type: string
      max_version:
        description: "Maximum version, inclusive (e.g. '2.0.0'). Leave empty for no upper bound."
        default: ""
        required: false
        type: string
      dependency_position_env_file:
        description: "0-based position of the dependency in the env file. Set to 'skip' to skip version pinning."
        default: "skip"
        required: false
        type: string
      requirements_file_name:
        description: "Path to the conda environment file (forwarded to test workflow matrix output)"
        default: ""
        required: false
        type: string
      conda_channel:
        description: "Anaconda.org channel to query (e.g. 'conda-forge', 'gurobi'). Defaults to 'conda-forge'."
        default: "conda-forge"
        required: false
        type: string
    outputs:
      versions_json:
        description: "JSON array of version strings, sorted ascending"
        value: ${{ jobs.query-versions.outputs.versions_json }}
      matrix_json:
        description: "JSON array of objects for test workflow matrix (library_name, library_version, dependency_position_env_file, requirements_file_name)"
        value: ${{ jobs.query-versions.outputs.matrix_json }}

  workflow_dispatch:
    inputs:
      package_name:
        description: "Name of the package to query"
        required: true
        type: string
      min_version:
        description: "Minimum version, inclusive. Leave empty for no lower bound."
        default: ""
        required: false
        type: string
      max_version:
        description: "Maximum version, inclusive. Leave empty for no upper bound."
        default: ""
        required: false
        type: string
      dependency_position_env_file:
        description: "0-based position in env file, or 'skip'"
        default: "skip"
        required: false
        type: string
      requirements_file_name:
        description: "Path to the conda environment file"
        default: ""
        required: false
        type: string
      conda_channel:
        description: "Anaconda.org channel to query. Defaults to 'conda-forge'."
        default: "conda-forge"
        required: false
        type: string

jobs:
  query-versions:
    name: "Query ${{ inputs.conda_channel }} versions of '${{ inputs.package_name }}'"
    runs-on: ubuntu-latest
    outputs:
      versions_json: ${{ steps.query.outputs.versions_json }}
      matrix_json: ${{ steps.query.outputs.matrix_json }}
    steps:
      - name: Install packaging library
        run: pip install --quiet packaging

      - name: Query and filter versions
        id: query
        shell: python
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          MIN_VERSION: ${{ inputs.min_version }}
          MAX_VERSION: ${{ inputs.max_version }}
          DEPENDENCY_POSITION: ${{ inputs.dependency_position_env_file }}
          REQUIREMENTS_FILE: ${{ inputs.requirements_file_name }}
          CONDA_CHANNEL: ${{ inputs.conda_channel }}
        run: |
          import json
          import os
          import urllib.request
          import urllib.error
          from packaging.version import Version, InvalidVersion

          package_name = os.environ["PACKAGE_NAME"].strip()
          min_version_str = os.environ.get("MIN_VERSION", "").strip()
          max_version_str = os.environ.get("MAX_VERSION", "").strip()
          dependency_position = os.environ.get("DEPENDENCY_POSITION", "skip").strip()
          requirements_file = os.environ.get("REQUIREMENTS_FILE", "").strip()
          conda_channel = os.environ.get("CONDA_CHANNEL", "conda-forge").strip() or "conda-forge"

          print("=" * 60)
          print(f"Package:      {package_name}")
          print(f"Channel:      {conda_channel}")
          print(f"Min version:  {min_version_str or '(no lower bound)'}")
          print(f"Max version:  {max_version_str or '(no upper bound)'}")
          print(f"Dep position: {dependency_position}")
          print(f"Req file:     {requirements_file or '(not set)'}")
          print("=" * 60)

          # Query the Anaconda.org API
          url = f"https://api.anaconda.org/package/{conda_channel}/{package_name}"
          req = urllib.request.Request(
              url,
              headers={"User-Agent": "github-actions/query-conda-versions-v1"},
          )
          try:
              with urllib.request.urlopen(req) as response:
                  data = json.loads(response.read().decode())
          except urllib.error.HTTPError as e:
              print(f"ERROR: Could not fetch package info for '{package_name}'. HTTP {e.code}: {e.reason}")
              raise SystemExit(1)

          all_versions = data.get("versions", [])
          print(f"Total versions available on {conda_channel}: {len(all_versions)}")

          # Build version bounds
          try:
              min_ver = Version(min_version_str) if min_version_str else None
          except InvalidVersion:
              print(f"ERROR: Invalid min_version value: '{min_version_str}'")
              raise SystemExit(1)

          try:
              max_ver = Version(max_version_str) if max_version_str else None
          except InvalidVersion:
              print(f"ERROR: Invalid max_version value: '{max_version_str}'")
              raise SystemExit(1)

          # Filter and sort
          filtered = []
          skipped_invalid = []
          for v in all_versions:
              try:
                  ver = Version(v)
                  if min_ver is not None and ver < min_ver:
                      continue
                  if max_ver is not None and ver > max_ver:
                      continue
                  filtered.append(v)
              except InvalidVersion:
                  skipped_invalid.append(v)

          filtered.sort(key=lambda v: Version(v))

          if skipped_invalid:
              print(f"Skipped {len(skipped_invalid)} non-PEP-440 version strings: {skipped_invalid}")

          print(f"Versions after filtering ({len(filtered)}):")
          for v in filtered:
              print(f"  - {v}")
          print("=" * 60)

          # Build outputs
          versions_json = json.dumps(filtered)
          matrix = [
              {
                  "library_name": package_name,
                  "library_version": v,
                  "dependency_position_env_file": dependency_position,
                  "requirements_file_name": requirements_file,
              }
              for v in filtered
          ]
          matrix_json = json.dumps(matrix)

          github_output = os.environ.get("GITHUB_OUTPUT", "")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"versions_json={versions_json}\n")
                  f.write(f"matrix_json={matrix_json}\n")
          else:
              print("versions_json output:")
              print(versions_json)
              print("matrix_json output:")
              print(json.dumps(matrix, indent=2))

      - name: Summary
        shell: bash
        run: |
          echo "### ${{ inputs.conda_channel }} version query results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Input | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package | \`${{ inputs.package_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Channel | \`${{ inputs.conda_channel }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Min version | \`${{ inputs.min_version || '—' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Max version | \`${{ inputs.max_version || '—' }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Versions found:** $(echo '${{ steps.query.outputs.versions_json }}' | python3 -c 'import sys,json; v=json.load(sys.stdin); print(len(v))')" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.query.outputs.versions_json }}' | python3 -m json.tool >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
