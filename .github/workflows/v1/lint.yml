# v1 reusable workflow: Lint and format check with ruff
#
# New in v1 -- every repo currently duplicates its own ruff workflow.
# This shared workflow eliminates that duplication.
#
# Usage:
#   jobs:
#     lint:
#       uses: FZJ-IEK3-VSA/.github/.github/workflows/v1/lint.yml@v1
#       with:
#         config_file: pyproject.toml
#
#   # Or with a pinned ruff version:
#     lint:
#       uses: FZJ-IEK3-VSA/.github/.github/workflows/v1/lint.yml@v1
#       with:
#         config_file: ruff.toml
#         ruff_version: "0.13.1"

name: "v1: Lint"

on:
  workflow_call:
    inputs:
      config_file:
        description: "Path to the ruff configuration file (e.g. 'pyproject.toml' or 'ruff.toml')"
        required: false
        default: "pyproject.toml"
        type: string
      ruff_version:
        description: "Ruff version to use (e.g. '0.13.1'). Leave empty for latest."
        required: false
        default: ""
        type: string
      runner_tag:
        description: "Runner label to execute on"
        required: false
        default: "ubuntu-latest"
        type: string

jobs:
  ruff:
    name: Ruff lint & format check
    runs-on: ${{ inputs.runner_tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/ruff-action@v3
        with:
          version: ${{ inputs.ruff_version || '' }}

      - name: Check linter
        run: ruff check --output-format=github --config=${{ inputs.config_file }}

      - name: Check formatting
        run: ruff format --diff --config=${{ inputs.config_file }}
