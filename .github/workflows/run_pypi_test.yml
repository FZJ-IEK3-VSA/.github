# v1 reusable workflow: Install from PyPI and run tests
#
# Consolidates the previous workflows:
#   - _run_single_pypi_test.yml          (pip + miniforge)
#   - _run_single_pypi_test_uv.yml       (uv only, no conda)
#   - _run_single_pypi_test_uv_miniforge.yml (uv + miniforge hybrid)
#   - _run_single_pypi_test_with_lfs.yml (pip + miniforge + LFS)
#
# The `installer` input selects the installation strategy:
#   - "pip"           : miniforge base + pip install (replaces _run_single_pypi_test / _with_lfs)
#   - "uv"            : uv only, no conda (replaces _run_single_pypi_test_uv)
#   - "uv_miniforge"  : miniforge base + uv pip install (replaces _run_single_pypi_test_uv_miniforge)
#
# New in v1:
#   - Single workflow with `installer` input replaces 4 separate files
#   - `lfs` input replaces the separate _with_lfs variant
#   - `coverage` + `coverage_package_name` for optional Codecov integration
#
# Usage:
#   jobs:
#     test:
#       uses: FZJ-IEK3-VSA/.github/.github/workflows/run_pypi_test.yml@v1
#       secrets: inherit
#       with:
#         runner_tag: ubuntu-latest
#         python_version: "3.12"
#         installer: uv_miniforge
#         optional_dependency_PyPI_tag: "[develop]"
#         additional_conda_forge_dependencies: "glpk gurobi"
#         coverage: true
#         coverage_package_name: "fine"

name: "v1: PyPI test"

on:
  workflow_call:
    inputs:
      runner_tag:
        description: "Runner label to execute the job on (e.g. 'ubuntu-latest', 'self-hosted')"
        required: true
        type: string
      python_version:
        description: "Python version to use (e.g. '3.12')"
        required: true
        type: string
      installer:
        description: "Installation strategy: 'pip' (miniforge+pip), 'uv' (uv only), or 'uv_miniforge' (miniforge+uv)"
        required: false
        default: "uv_miniforge"
        type: string
      additional_conda_forge_dependencies:
        description: "Space-separated conda-forge packages to install (e.g. 'glpk gurobi'). Only used with 'pip' and 'uv_miniforge' installers."
        default: ""
        required: false
        type: string
      additional_conda_channel:
        description: "Additional conda channel (e.g. 'gurobi'). Added via -c flag. Only used with 'pip' and 'uv_miniforge' installers."
        default: ""
        required: false
        type: string
      library_name:
        description: "Name of a library to pin to a specific version"
        default: ""
        required: false
        type: string
      library_version:
        description: "Version of the library to pin"
        default: ""
        required: false
        type: string
      optional_dependency_PyPI_tag:
        description: "Optional extras tag for pip/uv install (e.g. '[develop]')"
        required: false
        default: ""
        type: string
      ipynb_example_folder:
        description: "Folder containing Jupyter notebook examples to execute as tests"
        default: ""
        required: false
        type: string
      examples_to_execute:
        description: "Space-separated relative paths of specific examples to execute"
        default: ""
        required: false
        type: string
      multiprocessing_example_string:
        description: "pytest-xdist parallelism for examples (e.g. '-n auto', '-n 3'). Requires pytest-xdist and nbval in the project's dependencies."
        default: ""
        required: false
        type: string
      multiprocessing_pytest_string:
        description: "pytest-xdist parallelism for tests (e.g. '-n auto', '-n 3'). Requires pytest-xdist in the project's dependencies."
        default: ""
        required: false
        type: string
      lfs:
        description: "Whether to checkout with Git LFS"
        default: false
        required: false
        type: boolean
      coverage:
        description: "Enable pytest-cov coverage collection and Codecov upload. Use in exactly one matrix entry. Requires pytest-cov in the project's dependencies."
        default: false
        required: false
        type: boolean
      coverage_package_name:
        description: "Python package name for --cov=<name> (required when coverage is true)"
        default: ""
        required: false
        type: string
    secrets:
      WLSACCESSID:
        description: "Gurobi WLS access ID"
        required: false
      WLSSECRET:
        description: "Gurobi WLS secret"
        required: false
      LICENSEID:
        description: "Gurobi WLS license ID"
        required: false
      CODECOV_TOKEN:
        description: "Codecov upload token (required when coverage is true)"
        required: false

defaults:
  run:
    shell: pwsh

jobs:
  run-pypi-test:
    name: "Run test for ${{ inputs.library_name }}=${{ inputs.library_version }} on ${{ inputs.runner_tag }}"
    runs-on: ${{ inputs.runner_tag }}
    env:
      WLSACCESSID: ${{ secrets.WLSACCESSID }}
      WLSSECRET: ${{ secrets.WLSSECRET }}
      LICENSEID: ${{ secrets.LICENSEID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: ${{ inputs.lfs }}

      # --- Installer: uv (no conda) ---
      - name: Install uv and Python
        if: ${{ inputs.installer == 'uv' }}
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ inputs.python_version }}

      - name: Create virtual environment (uv)
        if: ${{ inputs.installer == 'uv' }}
        run: |
          uv venv .venv --python ${{ inputs.python_version }} --clear
          "${{ github.workspace }}\.venv\Scripts" | Out-File -FilePath $Env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=${{ github.workspace }}\.venv" | Out-File -FilePath $Env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install package (uv)
        if: ${{ inputs.installer == 'uv' }}
        run: |
          if ("${{ inputs.library_name }}" -eq "") {
            uv pip install .${{ inputs.optional_dependency_PyPI_tag }}
          } else {
            uv pip install .${{ inputs.optional_dependency_PyPI_tag }} "${{ inputs.library_name }}==${{ inputs.library_version }}"
          }
          uv pip list
          uv pip check

      # --- Installer: pip (miniforge + pip) ---
      - name: Setup miniforge
        if: ${{ inputs.installer == 'pip' || inputs.installer == 'uv_miniforge' }}
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: 25.11.0-1
          channels: conda-forge
          activate-environment: ""
          conda-remove-defaults: "true"

      - name: Create conda environment with Python (pip)
        if: ${{ inputs.installer == 'pip' }}
        run: |
          mamba env create --name test_env python=${{ inputs.python_version }} ${{ inputs.additional_conda_forge_dependencies }} ${{ inputs.additional_conda_channel != '' && format('-c {0}', inputs.additional_conda_channel) || '' }}
          mamba list --name test_env

      - name: Install package (pip)
        if: ${{ inputs.installer == 'pip' }}
        run: |
          if ("${{ inputs.library_name }}" -eq "") {
            mamba run --name test_env pip install .${{ inputs.optional_dependency_PyPI_tag }}
          } else {
            mamba run --name test_env pip install .${{ inputs.optional_dependency_PyPI_tag }} "${{ inputs.library_name }}==${{ inputs.library_version }}"
          }
          mamba run --name test_env pip list -v
          mamba run --name test_env pip check

      # --- Installer: uv_miniforge (miniforge + uv) ---
      - name: Create conda environment with Python and uv (uv_miniforge)
        if: ${{ inputs.installer == 'uv_miniforge' }}
        run: |
          mamba env create --name test_env python=${{ inputs.python_version }} uv ${{ inputs.additional_conda_forge_dependencies }} ${{ inputs.additional_conda_channel != '' && format('-c {0}', inputs.additional_conda_channel) || '' }}
          mamba list --name test_env

      - name: Install package (uv_miniforge)
        if: ${{ inputs.installer == 'uv_miniforge' }}
        run: |
          if ("${{ inputs.library_name }}" -eq "") {
            mamba run --name test_env uv pip install .${{ inputs.optional_dependency_PyPI_tag }}
          } else {
            mamba run --name test_env uv pip install .${{ inputs.optional_dependency_PyPI_tag }} "${{ inputs.library_name }}==${{ inputs.library_version }}"
          }
          mamba run --name test_env uv pip list
          mamba run --name test_env uv pip check

      # --- Common: Gurobi license ---
      - name: Write Gurobi WLS license file
        if: ${{ inputs.installer == 'pip' || inputs.installer == 'uv_miniforge' }}
        run: |
          if ($env:WLSACCESSID -and $env:WLSSECRET -and $env:LICENSEID) {
            $content = "WLSACCESSID=$env:WLSACCESSID`nWLSSECRET=$env:WLSSECRET`nLICENSEID=$env:LICENSEID`n"
            [IO.File]::WriteAllText((Join-Path $HOME "gurobi.lic"), $content)
            echo "Gurobi WLS license file written to $HOME/gurobi.lic"
          } else {
            echo "No Gurobi WLS credentials found, skipping license file creation"
          }

      # --- Common: Run tests ---
      - name: Run tests (conda-based)
        if: ${{ inputs.installer == 'pip' || inputs.installer == 'uv_miniforge' }}
        run: |
          $coverageArgs = @()
          if ("${{ inputs.coverage }}" -eq "true") {
            $coverageArgs = @("--cov=${{ inputs.coverage_package_name }}", "--cov-report=xml")
          }
          mamba run --name test_env pytest ${{ inputs.multiprocessing_pytest_string }} @coverageArgs -vv

      - name: Run tests (uv)
        if: ${{ inputs.installer == 'uv' }}
        run: |
          $coverageArgs = @()
          if ("${{ inputs.coverage }}" -eq "true") {
            $coverageArgs = @("--cov=${{ inputs.coverage_package_name }}", "--cov-report=xml")
          }
          pytest ${{ inputs.multiprocessing_pytest_string }} @coverageArgs -vv

      # --- Common: Upload coverage ---
      - name: Upload coverage to Codecov
        if: ${{ inputs.coverage }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      # --- Common: Run examples ---
      - name: Run all examples (conda-based)
        if: ${{ inputs.ipynb_example_folder != '' && (inputs.installer == 'pip' || inputs.installer == 'uv_miniforge') }}
        run: |
          mamba run --name test_env python -m pytest ${{ inputs.multiprocessing_example_string }} -vv --dist loadscope --nbval-lax --nbval-current-env --nbval-cell-timeout=900000 --durations=20 ${{ inputs.ipynb_example_folder }}/

      - name: Run all examples (uv)
        if: ${{ inputs.ipynb_example_folder != '' && inputs.installer == 'uv' }}
        run: |
          python -m pytest ${{ inputs.multiprocessing_example_string }} -vv --dist loadscope --nbval-lax --nbval-current-env --nbval-cell-timeout=900000 --durations=20 ${{ inputs.ipynb_example_folder }}/

      - name: Run selected examples (conda-based)
        if: ${{ inputs.examples_to_execute != '' && (inputs.installer == 'pip' || inputs.installer == 'uv_miniforge') }}
        run: |
          mamba run --name test_env python -m pytest ${{ inputs.multiprocessing_example_string }} -vv --dist loadscope --nbval-lax --nbval-current-env --nbval-cell-timeout=900000 --durations=20 ${{ inputs.examples_to_execute }}

      - name: Run selected examples (uv)
        if: ${{ inputs.examples_to_execute != '' && inputs.installer == 'uv' }}
        run: |
          python -m pytest ${{ inputs.multiprocessing_example_string }} -vv --dist loadscope --nbval-lax --nbval-current-env --nbval-cell-timeout=900000 --durations=20 ${{ inputs.examples_to_execute }}
