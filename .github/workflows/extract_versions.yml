# v1 reusable workflow: Extract version bounds from conda environment files
#
# Consolidates the previous workflows:
#   - _extract_env_versions.yml        (single library)
#   - _extract_env_versions_matrix.yml  (multiple libraries)
#
# Works for both single and multiple libraries. Always returns a matrix-compatible
# output. For single-library usage, also returns min_version, max_version, versions,
# and dependency_position outputs for backward compatibility.
#
# Usage (single library):
#   jobs:
#     extract:
#       uses: FZJ-IEK3-VSA/.github/.github/workflows/extract_versions.yml@v1
#       with:
#         libraries: "python"
#         env_file: environment.yml
#
#     test:
#       needs: extract
#       strategy:
#         matrix:
#           python_version: ${{ fromJSON(needs.extract.outputs.versions) }}
#       uses: .../run_conda_forge_test.yml@v1
#       with:
#         library_version: ${{ matrix.python_version }}
#         dependency_position_env_file: ${{ needs.extract.outputs.dependency_position }}
#
# Usage (multiple libraries, min/max/both):
#   jobs:
#     extract:
#       uses: FZJ-IEK3-VSA/.github/.github/workflows/extract_versions.yml@v1
#       with:
#         libraries: "numpy,pandas,scipy,scikit-learn"
#         version_type: both
#         env_file: requirements-dev.yml
#
#     test:
#       needs: extract
#       strategy:
#         matrix:
#           dependencies: ${{ fromJSON(needs.extract.outputs.matrix) }}
#       uses: .../run_conda_forge_test.yml@v1
#       with:
#         library_name: ${{ matrix.dependencies.library_name }}
#         library_version: ${{ matrix.dependencies.version }}
#         dependency_position_env_file: ${{ matrix.dependencies.yaml_position }}

name: "v1: Extract versions"

on:
  workflow_call:
    inputs:
      libraries:
        description: "Comma-separated list of library names (e.g. 'numpy' or 'numpy,pandas,scipy')"
        required: true
        type: string
      version_type:
        description: "Which versions to extract: 'min' (>=), 'max' (<=), or 'both'. Ignored for single-library 'versions' output."
        required: false
        type: string
        default: "both"
      env_file:
        description: "Path to the conda environment YAML file"
        required: false
        type: string
        default: "environment.yml"
    outputs:
      matrix:
        description: "JSON array of {library_name, version, version_type, yaml_position} for matrix strategy"
        value: ${{ jobs.extract.outputs.matrix }}
      # Single-library convenience outputs (populated when only one library is requested)
      min_version:
        description: "Minimum version from the constraint (>=X.Y.Z)"
        value: ${{ jobs.extract.outputs.min_version }}
      max_version:
        description: "Maximum version from the constraint (<=X.Y.Z)"
        value: ${{ jobs.extract.outputs.max_version }}
      versions:
        description: "JSON array of [min_version, max_version] for matrix strategy"
        value: ${{ jobs.extract.outputs.versions }}
      dependency_position:
        description: "0-based position of the dependency in the env file"
        value: ${{ jobs.extract.outputs.dependency_position }}

jobs:
  extract:
    name: Extract versions for ${{ inputs.libraries }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.extract.outputs.matrix }}
      min_version: ${{ steps.extract.outputs.min_version }}
      max_version: ${{ steps.extract.outputs.max_version }}
      versions: ${{ steps.extract.outputs.versions }}
      dependency_position: ${{ steps.extract.outputs.dependency_position }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract versions from ${{ inputs.env_file }}
        id: extract
        shell: python
        env:
          LIBRARIES: ${{ inputs.libraries }}
          VERSION_TYPE: ${{ inputs.version_type }}
          ENV_FILE: ${{ inputs.env_file }}
        run: |
          import json
          import os
          import re
          from pathlib import Path

          def parse_version_constraint(constraint):
              """Parse a conda version constraint and return (min_version, max_version)."""
              min_version = None
              max_version = None

              ge_match = re.search(r">=\s*([\d.]+)", constraint)
              le_match = re.search(r"<=\s*([\d.]+)", constraint)
              eq_match = re.search(r"==\s*([\d.]+)", constraint)

              if eq_match:
                  min_version = max_version = eq_match.group(1)
              else:
                  if ge_match:
                      min_version = ge_match.group(1)
                  if le_match:
                      max_version = le_match.group(1)

              return min_version, max_version

          def extract_library_info(env_file, library_name):
              """Extract version bounds and position for a library from environment.yml."""
              content = Path(env_file).read_text()
              lines = content.splitlines()

              # Use lookahead so "gurobi" does not match "gurobi-logtools"
              pattern = rf"^\s*-\s*{re.escape(library_name)}(?=\s|[><=!,]|$)(.*?)$"

              in_deps = False
              dep_count = 0

              for line in lines:
                  if "dependencies:" in line:
                      in_deps = True
                      continue
                  if in_deps:
                      stripped = line.strip()
                      if stripped.startswith("-") and not stripped.startswith("#"):
                          match = re.match(pattern, line, re.IGNORECASE)
                          if match:
                              constraint = match.group(1).strip()
                              min_ver, max_ver = parse_version_constraint(constraint)
                              return {
                                  "min_version": min_ver,
                                  "max_version": max_ver,
                                  "yaml_position": str(dep_count),
                              }
                          dep_count += 1

              return None

          # Main execution
          libraries = [lib.strip() for lib in os.environ["LIBRARIES"].split(",") if lib.strip()]
          version_type = os.environ["VERSION_TYPE"]
          env_file = os.environ["ENV_FILE"]

          # Build matrix output
          matrix_results = []
          for library_name in libraries:
              info = extract_library_info(env_file, library_name)
              if info:
                  if version_type == "min" and info["min_version"]:
                      matrix_results.append({
                          "library_name": library_name,
                          "version": info["min_version"],
                          "version_type": "min",
                          "yaml_position": info["yaml_position"],
                      })
                  elif version_type == "max" and info["max_version"]:
                      matrix_results.append({
                          "library_name": library_name,
                          "version": info["max_version"],
                          "version_type": "max",
                          "yaml_position": info["yaml_position"],
                      })
                  elif version_type == "both":
                      if info["min_version"]:
                          matrix_results.append({
                              "library_name": library_name,
                              "version": info["min_version"],
                              "version_type": "min",
                              "yaml_position": info["yaml_position"],
                          })
                      if info["max_version"]:
                          matrix_results.append({
                              "library_name": library_name,
                              "version": info["max_version"],
                              "version_type": "max",
                              "yaml_position": info["yaml_position"],
                          })

          # Debug output
          print("=" * 50)
          print(f"Libraries: {libraries}")
          print(f"Version type: {version_type}")
          print(f"Environment file: {env_file}")
          print(f"Generated matrix ({len(matrix_results)} entries):")
          for entry in matrix_results:
              print(f"  - {entry['library_name']}: {entry['version']} ({entry['version_type']}, position: {entry['yaml_position']})")
          print("=" * 50)

          # Write outputs
          github_output = os.environ.get("GITHUB_OUTPUT", "")
          if github_output:
              with open(github_output, "a") as f:
                  f.write(f"matrix={json.dumps(matrix_results)}\n")

                  # Single-library convenience outputs
                  if len(libraries) == 1:
                      info = extract_library_info(env_file, libraries[0])
                      if info:
                          min_v = info["min_version"] or ""
                          max_v = info["max_version"] or ""
                          versions = json.dumps([v for v in [min_v, max_v] if v])
                          f.write(f"min_version={min_v}\n")
                          f.write(f"max_version={max_v}\n")
                          f.write(f"versions={versions}\n")
                          f.write(f"dependency_position={info['yaml_position']}\n")

      - name: Debug - Print results
        run: |
          echo "========================================================"
          echo "Extracted ${{ inputs.version_type }} versions"
          echo "========================================================"
          echo "Libraries requested: ${{ inputs.libraries }}"
          echo "Environment file:    ${{ inputs.env_file }}"
          echo "========================================================"
          echo "Matrix output:"
          echo '${{ steps.extract.outputs.matrix }}' | python3 -m json.tool
          echo "========================================================"
          echo "Single-library outputs:"
          echo "  min_version:         ${{ steps.extract.outputs.min_version }}"
          echo "  max_version:         ${{ steps.extract.outputs.max_version }}"
          echo "  versions:            ${{ steps.extract.outputs.versions }}"
          echo "  dependency_position: ${{ steps.extract.outputs.dependency_position }}"
          echo "========================================================"
