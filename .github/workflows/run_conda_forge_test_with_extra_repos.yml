# v1 reusable workflow: Install from conda-forge with extra repos and run tests
#
# Extends run_conda_forge_test.yml with support for checking out and installing
# additional repositories before running tests. Useful for integration testing
# across multiple packages or testing against unreleased dependencies.
#
# Extra repos are cloned into subdirectories (e.g. ./geokit/), their requirements
# files are merged with yq, and they are installed with `pip install -e . --no-deps`.
#
# Usage:
#   jobs:
#     test:
#       uses: FZJ-IEK3-VSA/.github/.github/workflows/run_conda_forge_test_with_extra_repos.yml@v1
#       secrets: inherit
#       with:
#         runner_tag: "self-hosted"
#         requirements_file_name: requirements-dev.yml
#         extra_repos: |
#           [
#             {"repo": "FZJ-IEK3-VSA/geokit", "ref": "dev"},
#             {"repo": "FZJ-IEK3-VSA/other", "ref": "main", "requirements_file": "requirements.yml"}
#           ]
#
# extra_repos JSON schema (per entry):
#   repo              (required) — "org/name" of the repository
#   ref               (optional) — branch, tag, or SHA to checkout (default: repo default branch)
#   requirements_file (optional) — requirements YAML filename in that repo
#                                  (default: same as requirements_file_name input)

name: "v1: Conda-forge test with extra repos"

on:
  workflow_call:
    inputs:
      runner_tag:
        description: "Runner label to execute the job on (e.g. 'ubuntu-latest', 'self-hosted')"
        required: true
        type: string
      requirements_file_name:
        description: "Path to the conda environment YAML file (e.g. 'requirements-dev.yml')"
        required: true
        type: string
      extra_repos:
        description: |
          JSON array of extra repositories to checkout, merge requirements from, and install.
          Each entry: {"repo":"org/name","ref":"branch","requirements_file":"requirements-dev.yml"}
          - "ref" and "requirements_file" are optional.
        default: "[]"
        required: false
        type: string
      library_name:
        description: "Name of the library to pin to a specific version"
        default: ""
        required: false
        type: string
      library_version:
        description: "Version of the library to pin"
        default: ""
        required: false
        type: string
      dependency_position_env_file:
        description: "0-based position of the dependency in the env file's dependencies list. Set to 'skip' to skip version pinning."
        default: "skip"
        required: false
        type: string
      ipynb_example_folder:
        description: "Folder containing Jupyter notebook examples to execute as tests"
        default: ""
        required: false
        type: string
      examples_to_execute:
        description: "Space-separated relative paths of specific examples to execute"
        default: ""
        required: false
        type: string
      multiprocessing_example_string:
        description: "pytest-xdist parallelism for examples (e.g. '-n auto', '-n 3'). Requires pytest-xdist and nbval in the project's requirements file."
        default: ""
        required: false
        type: string
      multiprocessing_pytest_string:
        description: "pytest-xdist parallelism for tests (e.g. '-n auto', '-n 3'). Requires pytest-xdist in the project's requirements file."
        default: ""
        required: false
        type: string
      additional_conda_channel:
        description: "Additional conda channel (e.g. 'gurobi'). Added via -c flag to mamba env create."
        default: ""
        required: false
        type: string
      lfs:
        description: "Whether to checkout the main repository with Git LFS"
        default: false
        required: false
        type: boolean
      coverage:
        description: "Enable pytest-cov coverage collection and Codecov upload. Use in exactly one matrix entry. Requires pytest-cov in the project's requirements file."
        default: false
        required: false
        type: boolean
      coverage_package_name:
        description: "Python package name for --cov=<name> (required when coverage is true)"
        default: ""
        required: false
        type: string
    secrets:
      GITHUB_PAT:
        description: "Personal access token for cloning private extra repos. Falls back to GITHUB_TOKEN for public repos."
        required: false
      ZENODO_API_KEY:
        description: "Zenodo API key to increase download limits"
        required: false
      ZENODO_USER_AGENT_STRING:
        description: "User agent string for Zenodo API access"
        required: false
      WLSACCESSID:
        description: "Gurobi WLS access ID"
        required: false
      WLSSECRET:
        description: "Gurobi WLS secret"
        required: false
      LICENSEID:
        description: "Gurobi WLS license ID"
        required: false
      CODECOV_TOKEN:
        description: "Codecov upload token (required when coverage is true)"
        required: false

defaults:
  run:
    shell: pwsh

jobs:
  run-conda-forge-test:
    name: "Run test for ${{ inputs.library_name }}=${{ inputs.library_version }} on ${{ inputs.runner_tag }}"
    runs-on: ${{ inputs.runner_tag }}
    env:
      ZENODO_API_KEY: ${{ secrets.ZENODO_API_KEY }}
      ZENODO_USER_AGENT_STRING: ${{ secrets.ZENODO_USER_AGENT_STRING }}
      WLSACCESSID: ${{ secrets.WLSACCESSID }}
      WLSSECRET: ${{ secrets.WLSSECRET }}
      LICENSEID: ${{ secrets.LICENSEID }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v6
        with:
          lfs: ${{ inputs.lfs }}

      # Clones each extra repo into a subdirectory named after the repo (e.g. ./geokit/).
      # Uses GITHUB_PAT if provided (needed for private repos), otherwise falls back to GITHUB_TOKEN.
      - name: Checkout extra repositories
        if: ${{ inputs.extra_repos != '[]' && inputs.extra_repos != '' }}
        env:
          CLONE_TOKEN: ${{ secrets.GITHUB_PAT || github.token }}
        run: |
          $extraRepos = '${{ inputs.extra_repos }}' | ConvertFrom-Json
          foreach ($entry in $extraRepos) {
            $repoName = $entry.repo.Split('/')[-1]
            Write-Host "Cloning $($entry.repo) into ./$repoName"
            $cloneArgs = @(
              "clone",
              "https://x-access-token:$env:CLONE_TOKEN@github.com/$($entry.repo).git",
              $repoName,
              "--depth=1"
            )
            if ($entry.ref) {
              $cloneArgs += @("--branch", $entry.ref)
            }
            & git @cloneArgs
            if ($LASTEXITCODE -ne 0) {
              Write-Error "Failed to clone $($entry.repo)"
              exit 1
            }
          }

      - name: Pin dependency version
        uses: fjogeleit/yaml-update-action@main
        if: ${{ inputs.dependency_position_env_file != 'skip' }}
        with:
          valueFile: ${{ inputs.requirements_file_name }}
          commitChange: false
          method: CreateOrUpdate
          changes: |
            {
            "dependencies[${{ inputs.dependency_position_env_file }}]": "${{ inputs.library_name }}=${{ inputs.library_version }}"
            }

      # Collects all requirements files (main repo + extra repos) and merges them
      # with yq so that dependencies are deduplicated and versions are unified.
      - name: Setup yq
        uses: vegardit/gha-setup-yq@v1
        with:
          use-cache: true

      - name: Merge requirements files
        run: |
          $extraRepos = '${{ inputs.extra_repos }}' | ConvertFrom-Json
          $reqFiles = @("${{ inputs.requirements_file_name }}")
          foreach ($entry in $extraRepos) {
            $repoName = $entry.repo.Split('/')[-1]
            $reqFile  = if ($entry.requirements_file) { $entry.requirements_file } else { "${{ inputs.requirements_file_name }}" }
            $reqPath  = "$repoName/$reqFile"
            if (-not (Test-Path $reqPath)) {
              Write-Error "Requirements file not found: $reqPath"
              exit 1
            }
            $reqFiles += $reqPath
          }
          if ($reqFiles.Count -gt 1) {
            Write-Host "Merging: $($reqFiles -join ', ')"
            $yqArgs = $reqFiles -join " "
            Invoke-Expression "yq eval-all '. as `$item ireduce ({}; . *+ `$item)' $yqArgs > combined_env.yml"
          } else {
            Write-Host "No extra repos — using requirements file as-is"
            Copy-Item "${{ inputs.requirements_file_name }}" combined_env.yml
          }
          Write-Host "--- combined_env.yml ---"
          Get-Content combined_env.yml

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: 25.11.0-1
          channels: conda-forge
          activate-environment: "test_env"
          conda-remove-defaults: "true"
          auto-activate-base: false

      - name: Create conda environment
        run: |
          $channelArg = if ("${{ inputs.additional_conda_channel }}" -ne "") { "-c ${{ inputs.additional_conda_channel }}" } else { "" }
          Invoke-Expression "mamba env create --name test_env --file=combined_env.yml $channelArg"

      # Installs the main repo and all extra repos as editable packages.
      # --no-deps ensures conda-managed dependencies are not overridden by pip.
      - name: Install packages (editable)
        run: |
          mamba run --name test_env pip install -e . --no-deps
          $extraRepos = '${{ inputs.extra_repos }}' | ConvertFrom-Json
          foreach ($entry in $extraRepos) {
            $repoName = $entry.repo.Split('/')[-1]
            Write-Host "Installing ./$repoName"
            mamba run --name test_env pip install -e "./$repoName" --no-deps
          }
          mamba list --name test_env

      - name: Write Gurobi WLS license file
        run: |
          if ($env:WLSACCESSID -and $env:WLSSECRET -and $env:LICENSEID) {
            $content = "WLSACCESSID=$env:WLSACCESSID`nWLSSECRET=$env:WLSSECRET`nLICENSEID=$env:LICENSEID`n"
            [IO.File]::WriteAllText((Join-Path $HOME "gurobi.lic"), $content)
            Write-Host "Gurobi WLS license file written to $HOME/gurobi.lic"
          } else {
            Write-Host "No Gurobi WLS credentials found, skipping license file creation"
          }

      - name: Run tests
        run: |
          $coverageArgs = ""
          if ("${{ inputs.coverage }}" -eq "true") {
            $coverageArgs = "--cov=${{ inputs.coverage_package_name }} --cov-report=xml"
          }
          mamba run --name test_env pytest ${{ inputs.multiprocessing_pytest_string }} $coverageArgs -vv

      - name: Upload coverage to Codecov
        if: ${{ inputs.coverage }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Run all examples
        if: ${{ inputs.ipynb_example_folder != '' }}
        run: |
          mamba run --name test_env python -m pytest ${{ inputs.multiprocessing_example_string }} -vv --dist loadscope --nbval-lax --nbval-current-env --nbval-cell-timeout=900000 --durations=20 ${{ inputs.ipynb_example_folder }}/

      - name: Run selected examples
        if: ${{ inputs.examples_to_execute != '' }}
        run: |
          mamba run --name test_env python -m pytest ${{ inputs.multiprocessing_example_string }} -vv --dist loadscope --nbval-lax --nbval-current-env --nbval-cell-timeout=900000 --durations=20 ${{ inputs.examples_to_execute }}
