# v1 reusable workflow: Mirror repository to JuGit
#
# Synchronizes a GitHub repository to the JuGit GitLab instance at
# Forschungszentrum Jülich by force-pushing the triggering branch.
#
# Required secret: JUGIT_ACCESS_TOKEN (a JuGit personal access token with
# write access to the target repository).
#
# Usage:
#   # In the caller repo's workflow (e.g. .github/workflows/push_to_jugit.yml):
#   name: Mirror to JuGit
#   on:
#     workflow_dispatch:
#     push:
#       branches:
#         - develop
#         - master
#
#   jobs:
#     mirror:
#       uses: FZJ-IEK3-VSA/.github/.github/workflows/sync_jugit.yml@v1
#       secrets: inherit
#       with:
#         jugit_repo_path: "iek-3/shared-code/tsam"

name: "v1: Sync to JuGit"

on:
  workflow_call:
    inputs:
      jugit_repo_path:
        description: "Path of the target repository on JuGit (e.g. 'iek-3/shared-code/tsam')"
        required: true
        type: string
    secrets:
      JUGIT_ACCESS_TOKEN:
        description: "JuGit personal access token with write access to the target repository"
        required: true

jobs:
  mirror:
    name: Push ${{ github.ref_name }} to JuGit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate and mask access token
        env:
          TOKEN: ${{ secrets.JUGIT_ACCESS_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::JUGIT_ACCESS_TOKEN secret is not set or empty. Please add a valid JuGit personal access token to the repository secrets."
            exit 1
          fi
          echo "::add-mask::$TOKEN"

      - name: Push to JuGit
        env:
          TOKEN: ${{ secrets.JUGIT_ACCESS_TOKEN }}
        run: |
          git config user.name "${{ github.event.head_commit.author.name }}"
          git config user.email "${{ github.event.head_commit.author.email }}"

          # Use a credential helper so the token never appears in command args or trace output
          git config credential.helper '!f() { echo "username=push_to_jugit"; echo "password=${TOKEN}"; }; f'

          REMOTE_URL="https://jugit.fz-juelich.de/${{ inputs.jugit_repo_path }}.git"

          if ! output=$(git push --force "$REMOTE_URL" ${{ github.ref_name }} 2>&1); then
            echo "$output"

            if echo "$output" | grep -qi "authentication\|401\|403\|forbidden\|invalid.*token\|access denied"; then
              echo "::error::Authentication failed. The JUGIT_ACCESS_TOKEN may be invalid, expired, or lacks write access to jugit.fz-juelich.de/${{ inputs.jugit_repo_path }}."
            elif echo "$output" | grep -qi "not found\|404\|does not exist"; then
              echo "::error::Repository not found at jugit.fz-juelich.de/${{ inputs.jugit_repo_path }}. Verify the jugit_repo_path input and that the token has access to this project."
            else
              echo "::error::Failed to push to JuGit. See output above for details."
            fi
            exit 1
          fi
